# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "07ea92aef2ae48b5d72486520432af48"
name = "GalleryNest"
application_url = "https://gallerynest.kaswebtechsolutions.com/"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products"

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  compliance_topics = [ "customers/redact", "customers/data_request", "shop/redact" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://gallerynest.kaswebtechsolutions.com/auth/callback" ]

[app_proxy]
url = "https://gallerynest.kaswebtechsolutions.com/apps/gallery-nest"
subpath = "gallery-nest"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
